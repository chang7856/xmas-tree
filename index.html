<meta name="theme-color" content="#07100B">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--night:#07100B;--cream:#EFE3C3;--gold:#E8C170;--pink:#F2A7D8;--cyan:#8FE3FF;--magenta:#FF4FD8;--alert:#FF6B6B;--display:"Instrument Serif","Noto Serif TC",Georgia,serif;--body:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:fixed;inset:0}
#stage canvas.gl{display:block;width:100%;height:100%}
canvas.ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
.ui{position:fixed;inset:0;pointer-events:none}
.frame{position:absolute;inset:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.frame i{position:absolute;width:18px;height:18px;border:1.5px solid rgba(239,227,195,.8)}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.frame .info{position:absolute;right:26px;bottom:4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(239,227,195,.75)}
.frame .info.l{right:auto;left:26px}
.chips{position:absolute;left:16px;right:16px;top:calc(22px + env(safe-area-inset-top,0px));display:flex;gap:8px;justify-content:space-between;align-items:center}
.chip{font:inherit;font-size:12px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(239,227,195,.25);background:rgba(239,227,195,.06);color:var(--cream);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:inline-flex;align-items:center;gap:6px;transition:all .3s;white-space:nowrap;pointer-events:auto}
.chip[data-s="detect"]{border-color:var(--gold);color:var(--gold)}
.chip[data-s="on"]{border-color:var(--cyan);background:rgba(143,227,255,.14);color:#fff;box-shadow:0 0 18px rgba(143,227,255,.35)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.8}
button.chip{cursor:pointer}
.greet{position:absolute;left:0;right:0;top:50%;text-align:center;opacity:0;transition:opacity .4s}
.greet .w{display:inline-block;font-family:var(--display);font-size:clamp(36px,9vw,72px);line-height:1.05;font-weight:500;white-space:nowrap;background:linear-gradient(100deg,var(--cream) 0%,var(--pink) 40%,var(--cyan) 70%,var(--cream) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(242,167,216,.35))}
.greet .w[lang="zh-Hant"]{font-family:"Noto Serif TC",serif;font-weight:700;letter-spacing:.06em}
.greet .w span{display:inline-block;white-space:pre}
.hud{position:absolute;inset:0;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--cyan);opacity:0;transition:opacity .4s}
.hud .lab{position:absolute;white-space:nowrap;opacity:0;color:var(--magenta)}
.hud .box{position:absolute;border:1px solid var(--alert);opacity:0}
.hud .dash{position:absolute;border-top:1px dashed rgba(143,227,255,.5);transform-origin:0 0;opacity:0}
.hud .txt{position:absolute;left:6%;bottom:calc(19% + env(safe-area-inset-bottom,0px));color:var(--cream);line-height:1.7;white-space:pre-wrap;max-width:88%}
.hint{position:absolute;left:16px;right:16px;text-align:center;transition:opacity .3s;pointer-events:none}
.hint span{display:inline-block;font-size:15px;font-weight:500;line-height:1.4;padding:9px 16px;border-radius:999px;background:rgba(7,16,11,.55);border:1px solid rgba(239,227,195,.25);color:var(--cream);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hint span:empty{display:none}
.dbg{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:10px;color:rgba(239,227,195,.6);white-space:pre}
.bar{position:absolute;left:16px;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;padding:10px;border-radius:16px;background:rgba(239,227,195,.06);border:1px solid rgba(239,227,195,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto;max-width:420px;margin:0 auto}

.bar button.pri{background:var(--cream);color:var(--night);border-color:var(--cream)}
.card{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;background:rgba(7,16,11,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;opacity:0;transition:opacity .4s}
.card.show{opacity:1}
.card:not(.show){pointer-events:none}
.card h4{font-family:var(--display);font-size:32px;font-weight:500;margin:0 0 8px;line-height:1.15;color:var(--cream)}
.card p{font-size:14px;color:rgba(239,227,195,.8);margin:0 0 20px;max-width:24em;line-height:1.7}
.card .err{color:var(--alert)}
.card .ring{width:48px;height:48px;border-radius:50%;border:2px solid rgba(239,227,195,.2);border-top-color:var(--cream);animation:spin 1s linear infinite;margin:0 auto 16px}
.card img{max-width:min(70vw,360px);max-height:50vh;border-radius:14px;border:1px solid rgba(239,227,195,.25);margin:0 auto 16px;display:block}
.card .b{font:inherit;font-size:15px;font-weight:500;min-height:48px;padding:0 24px;border-radius:12px;border:1px solid var(--cream);background:var(--cream);color:var(--night);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.card .b.sec{background:transparent;color:var(--cream);border-color:rgba(239,227,195,.4);margin-left:8px}
.card .mono{font-family:var(--mono);font-size:11px;color:rgba(239,227,195,.5);margin-top:14px}
.toast{position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:rgba(239,227,195,.14);border:1px solid rgba(239,227,195,.3);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:all .3s;pointer-events:none;backdrop-filter:blur(12px);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.card .ring{animation:none}}
</style>
</head>

const filt = new HandFilter({ minCutoff: 1.0, beta: 0.02 }); const G = new GestureEngine({ W: W() });

/* ---------- 狀態 ---------- */
const NEXT = { ready: "張開手掌，點燈", open: "握拳，熄燈收樹", fist: "手像撒鹽一樣抖一抖，會下雪", shake: "捏合，掛一顆光球", pinch: "比愛心", heart: "左右揮手，換語言", swipe: "雙手拉開", spread: "雙手合上，變回樹", close: "雙手交疊", cross: "食指畫一顆心", point: "張開手掌，再點一次燈" };

const setBar = () => {};

async function go(k) {

    $("bRetry").addEventListener("click", () => go("loading")); $("bTreeOnly").addEventListener("click", () => { hideCard(); setBar(true); state = "treeonly"; hint.textContent = "沒有相機，只看樹"; T.light(); }); }
  if (k === "unsup") { setBar(false); hint.textContent = ""; showCard(`<div><h4 class="err">不支援</h4><p>這個瀏覽器跑不動手勢模型。用 Safari 或 Chrome 開這個連結。</p><button class="b" id="bCopy" type="button">複製連結</button></div>`); $("bCopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(location.href); showToast("已複製"); } catch { showToast("請長按網址列複製"); } }); }
  if (!["perm", "loading", "nocam", "unsup"].includes(k) && T.u.uGrow.value < 0.5) T.grow();
}
chipL.addEventListener("click", () => { lang = LANGS[(LANGS.indexOf(lang) + 1) % 3]; chipL.textContent = lang.toUpperCase(); D.lang = lang; setGreet(greet, lang, form !== "text"); if (form === "text") T.setForm(FORM[lang]); });

/* ---------- 手勢 → 場景 ---------- */
const starPx = () => { const v = new THREE.Vector3(0, -1.5 / TS + 0.02 + 2.1 + 0.08, 0); v.applyMatrix4(T.treeG.matrixWorld); v.project(st.camera); return [(v.x * 0.5 + 0.5) * W(), (-v.y * 0.5 + 0.5) * H()]; };
const ndc = (p) => ({ x: (p[0] / W()) * 2 - 1, y: -((p[1] / H()) * 2 - 1) });
const burstSnow = (x, y, n = 36) => { for (let i = 0; i < n; i++) flakes.push({ x: x + (Math.random() - .5) * 40, y: y + (Math.random() - .5) * 20, vx: (Math.random() - .5) * 90, vy: 20 + Math.random() * 60, t: 0, d: 2 + Math.random() * 1.5, g: SNOWG[(Math.random() * SNOWG.length) | 0], s: 9 + Math.random() * 9, r: Math.random() * 6.28 }); };
G.on((type, g) => {
  const hs = hands.filter(Boolean);
  if (type === "enter") {
    if (g === "open") { T.light(); const [sx, sy] = starPx(); const w = hs[0][0]; for (let i = 0; i < 70; i++) sparks.push({ x: w[0], y: w[1], tx: sx, ty: sy, t: 0, d: 0.7 + Math.random() * 0.5, k: (Math.random() - 0.5) * 160 }); hint.textContent = NEXT.open; prevWristX = w[0]; }
    if (g === "fist") { form = "tree"; T.collapse(); greet.style.opacity = 0; hint.textContent = NEXT.fist; }
    if (g === "pinch") { const tip = ndc(hs[0][8]); let best = -1, bd = 9; D.orbs.forEach((o, i) => { const d = Math.hypot((o.x - tip.x) * (W() / H()), o.y - tip.y); if (d < bd) { bd = d; best = i; } }); grabbed = best; if (best >= 0) { D.orbs[best].anchor = null; D.orbs[best].hold = tip; } hint.textContent = "放開，掛到樹上"; }
    if (g === "point") hint.textContent = NEXT.point;
    if (g === "heart") { form = "text"; T.light(); T.setForm(FORM[lang]); hint.textContent = NEXT.heart; }
    if (g === "cross") { clearTimeout(crossTimer); tween(T.u.uDim, "value", 0.45, 500); hud.style.opacity = 1; B.show(); playHud(hud, hudTxt, pickHud(lang)); hint.textContent = ""; }
  }
  if (type === "exit") {
    if (g === "open") prevWristX = null;
    if (g === "pinch" && grabbed >= 0) { const o = D.orbs[grabbed]; o.hold = null; o.anchor = { x: (Math.random() - 0.5) * 0.5, y: -0.55 + Math.random() * 0.4 }; o.flash = 1; grabbed = -1; showToast("掛上去了"); hint.textContent = NEXT.pinch; }
    if (g === "cross") { crossTimer = setTimeout(() => { B.dissolve(); hud.style.opacity = 0; tween(T.u.uDim, "value", 1, 600); hint.textContent = NEXT.cross; }, 4000); }
  }
  if (type === "swipe") { if (form === "text") { lang = LANGS[(LANGS.indexOf(lang) + 1) % 3]; chipL.textContent = lang.toUpperCase(); D.lang = lang; T.setForm(FORM[lang]); } else T.dragV += g === "right" ? 2.2 : -2.2; hint.textContent = NEXT.swipe; }
  if (type === "spread") { form = "galaxy"; T.light(); T.setForm(FORM.galaxy); hint.textContent = NEXT.spread; }
  if (type === "close") { form = "tree"; T.setForm(FORM.tree); hint.textContent = NEXT.close; }
  if (type === "shake") { burstSnow(g.x, g.y); hint.textContent = NEXT.shake; }
});

/* ---------- 每幀 ---------- */
const names = { open: "張開手掌", fist: "握拳", pinch: "捏合", point: "食指指向", heart: "比愛心", cross: "雙手交疊", wide: "雙手張開", "two-open": "雙手張開", two: "兩隻手", none: "待機" };
st.hooks.push({ update(s, dt) {
  cam.material.uniforms.uTime.value = s.t; if (vtex.image && vtex.image.readyState >= 2) vtex.needsUpdate = true;
  const w = greet.querySelector(".w"); const hx = hands[0] ? (hands[0][0][0] / W()) * 2 - 1 : Math.sin(s.t * 0.7) * 0.6; w.style.backgroundPosition = `${50 + hx * 45}% 0`;
  frameN++; const live = ["ready", "nohand", "treeonly"].includes(state);
  if (live && state !== "treeonly") { const raw = detect(performance.now()); hands = filt.apply(raw, s.t); G.W = W(); gInfo = G.update(hands, s.t); if (hands.some(Boolean)) lastHandSeen = s.t; }
  // 臉的禁區
  if (face) { faceT.x += (face.x - faceT.x) * 0.1; faceT.y += (face.y - faceT.y) * 0.1; faceT.r += (face.r - faceT.r) * 0.1; } D.zone.x = faceT.x; D.zone.y = faceT.y; D.zone.r = faceT.r;
  // 捏住的光球、光軌、連續轉樹
  if (grabbed >= 0 && hands[0]) D.orbs[grabbed].hold = ndc(hands[0][8]);
  if (gInfo.active === "point" && hands[0]) trail.push({ x: hands[0][8][0], y: hands[0][8][1], t: s.t });
  while (trail.length && s.t - trail[0].t > 1.2) trail.shift();
  if (gInfo.active === "open" && hands[0] && prevWristX !== null) { const dx = hands[0][0][0] - prevWristX; if (Math.abs(dx) < W() * 0.08) T.rot += dx / W() * 2.6; prevWristX = hands[0][0][0]; }
  // 沒偵測到手
  if (state === "ready" && s.t - lastHandSeen > 3 && !hands.some(Boolean)) go("nohand");
  if (state === "nohand" && hands.some(Boolean)) { hideCard(); state = "ready"; hint.textContent = NEXT.ready; }
  // 晶片
  if (gInfo.active !== "none") { chipG.dataset.s = "on"; chipG.firstChild.textContent = names[gInfo.active] + " 成立"; chipN.textContent = ""; }
  else if (gInfo.cand !== "none" && gInfo.cand !== "two") { chipG.dataset.s = "detect"; chipG.firstChild.textContent = names[gInfo.cand] || gInfo.cand; chipN.textContent = ""; }
  else { chipG.dataset.s = "idle"; chipG.firstChild.textContent = hands.some(Boolean) ? "就緒" : "待機"; chipN.textContent = ""; }
  // 骨架、光軌、星火、雪
  const DPR = PHONE ? 1 : Math.min(devicePixelRatio || 1, 1.5); if (ov.width !== W() * DPR || ov.height !== H() * DPR) { ov.width = W() * DPR; ov.height = H() * DPR; }
  ovx.setTransform(DPR, 0, 0, DPR, 0, 0); ovx.clearRect(0, 0, W(), H());
  ovx.save(); ovx.beginPath(); ovx.rect(0, 0, W(), H() * SPLIT); ovx.clip(); drawHands(ovx, hands, { label: gInfo.active !== "none" ? names[gInfo.active] : (gInfo.cand !== "none" && gInfo.cand !== "two" ? names[gInfo.cand] : null), progress: gInfo.progress || 0, active: gInfo.active !== "none" }); ovx.restore();
  if (!dbg.hidden) { fpsN++; fpsT += dt; if (fpsT >= 0.5) { dbg.textContent = `${Math.round(fpsN / fpsT)} fps  ${W()}×${H()}  dpr ${st.DPR}  點 ${PHONE ? 26000 : 60000}  手 ${hands.filter(Boolean).length}`; fpsN = 0; fpsT = 0; } }
  if (trail.length > 1) { ovx.save(); ovx.lineCap = "round"; ovx.lineJoin = "round"; ovx.shadowColor = "rgba(232,193,112,.9)"; ovx.shadowBlur = 14; for (let i = 1; i < trail.length; i++) { const a = 1 - (s.t - trail[i].t) / 1.2; ovx.strokeStyle = `rgba(232,193,112,${a})`; ovx.lineWidth = 2 + 3 * a; ovx.beginPath(); ovx.moveTo(trail[i - 1].x, trail[i - 1].y); ovx.lineTo(trail[i].x, trail[i].y); ovx.stroke(); } ovx.restore(); }
  for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.t += dt; const u = Math.min(1, p.t / p.d); const e = 1 - Math.pow(1 - u, 3); const x = p.x + (p.tx - p.x) * e + Math.sin(u * Math.PI) * p.k, y = p.y + (p.ty - p.y) * e - Math.sin(u * Math.PI) * 60; ovx.fillStyle = `rgba(232,193,112,${1 - u * 0.6})`; ovx.shadowColor = "rgba(232,193,112,.8)"; ovx.shadowBlur = 8; ovx.beginPath(); ovx.arc(x, y, 1.6 + 1.4 * (1 - u), 0, 6.283); ovx.fill(); if (u >= 1) sparks.splice(i, 1); }
  ovx.shadowBlur = 0; ovx.textAlign = "center"; ovx.textBaseline = "middle";
  for (let i = flakes.length - 1; i >= 0; i--) { const f = flakes[i]; f.t += dt; f.vy += 70 * dt; f.x += f.vx * dt + Math.sin(f.t * 3 + f.r) * 12 * dt; f.y += f.vy * dt; const a = 1 - f.t / f.d; ovx.fillStyle = `rgba(239,227,195,${Math.max(0, a) * 0.9})`; ovx.font = `500 ${f.s}px "Noto Sans TC","IBM Plex Mono",sans-serif`; ovx.fillText(f.g, f.x, f.y); if (f.t >= f.d || f.y > H() + 20) flakes.splice(i, 1); }
} });

/* ---------- 模擬模式：沒有相機時用虛擬手輪流做手勢（?sim=1） ---------- */
const K = (pose, x, y, at, extra = {}) => { const k = Math.min(W() / 390, H() * SPLIT / 500); return { pose, x: W() / 2 + (x - 195) * k, y: (y - 200) / 644 * H() * SPLIT, at, size: 80 * k, ...extra, left: !!extra.left }; };
const TRACKS = {
  open: () => [[K("relax", 250, 900, 0), K("open", 240, 560, 0.6, { hold: 2.6 })], null],
  fist: () => [[K("open", 240, 560, 0), K("fist", 240, 570, 0.5, { hold: 2.2 })], null],
  shake: () => { const ks = [K("relax", 230, 420, 0)]; for (let i = 1; i <= 8; i++) ks.push(K("relax", 230, 420 + (i % 2 ? 40 : -40), 0.3 + i * 0.12, { hold: i === 8 ? 1 : 0 })); return [ks, null]; },
  pinch: () => [[K("open", 310, 400, 0), K("pinch", 310, 400, 0.5), K("pinch", 200, 560, 1.6), K("open", 205, 560, 1.9, { hold: 1.2 })], null],
  heart: () => [[K("relax", 300, 820, 0, { left: true }), K("heart", 274, 540, 0.7, { left: true, rot: -0.3, hold: 3 })], [K("relax", 90, 820, 0), K("heart", 116, 540, 0.7, { rot: 0.3, hold: 3 })]],
  swipe: () => [[K("open", 70, 540, 0), K("open", 70, 540, 0.35), K("open", 330, 540, 0.65, { hold: 1 })], null],
  spread: () => [[K("open", 160, 560, 0, { left: true }), K("open", 160, 560, 0.3, { left: true }), K("open", 62, 560, 0.75, { left: true, hold: 2.2 })], [K("open", 230, 560, 0), K("open", 230, 560, 0.3), K("open", 328, 560, 0.75, { hold: 2.2 })]],
  close: () => [[K("open", 62, 560, 0, { left: true }), K("open", 62, 560, 0.3, { left: true }), K("open", 160, 560, 0.75, { left: true, hold: 2 })], [K("open", 328, 560, 0), K("open", 328, 560, 0.3), K("open", 230, 560, 0.75, { hold: 2 })]],
  cross: () => [[K("relax", 110, 820, 0, { left: true }), K("open", 206, 600, 0.6, { left: true, rot: 0.45, hold: 3.6 })], [K("relax", 280, 820, 0), K("open", 184, 600, 0.6, { rot: -0.45, hold: 3.6 })]],
  point: () => { const ks = [K("point", 200, 600, 0, { size: 70 })]; for (let i = 0; i <= 26; i++) { const t = (i / 26) * Math.PI * 2; ks.push(K("point", 195 + 16 * Math.pow(Math.sin(t), 3) * 5.2, 520 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 5.2, 0.5 + i * 0.1, { size: 70, hold: i === 26 ? 1.2 : 0 })); } return [ks, null]; },
};
let simRunning = false;
async function simLoop() { if (simRunning) return; simRunning = true; const seq = [["open", 4000], ["fist", 5200], ["shake", 3200], ["pinch", 3600], ["heart", 4200], ["swipe", 3000], ["spread", 3800], ["close", 3200], ["cross", 8200], ["point", 4600]];
  while (state === "ready" || state === "nohand") { for (const [g, ms] of seq) { if (state !== "ready" && state !== "nohand") break; sim.play(TRACKS[g](), st.t); filt.reset(); G.reset(); await delay(ms); } } simRunning = false; }

setInterval(() => { const d = new Date(); $("clock").textContent = `${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}  ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }, 1000);
const place = () => { const sp = SPLIT * 100; $("hl0").style.cssText = "left:10%;top:9%"; $("hl1").style.cssText = "left:60%;top:14%"; $("hl2").style.cssText = "left:64%;top:30%"; $("hb0").style.cssText = "left:38%;top:16%;width:16%;height:12%"; $("hd0").style.cssText = "left:52%;top:20%;width:18%;transform:rotate(24deg)"; hudTxt.style.cssText = `left:6%;top:calc(${sp}% - 84px);bottom:auto`;
  greet.style.top = `${sp}%`; greet.style.transform = "translateY(-50%)"; document.querySelector(".frame").style.bottom = `calc(${100 - sp}% + 6px)`; document.querySelector(".hint").style.top = `calc(${sp}% + 14px)`; };
place(); addEventListener("resize", place);
go("perm"); T.grow();
</script>
</body>
